<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
  <meta name="theme-color" content="#1a3a6e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>DCMB Info Bot</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Davenport Central Marching Band</h1>
        <p>Schedule &amp; Info Bot</p>
      </div>
    </header>

    <main>
      <div id="chat-window"></div>
    </main>

    <div class="composer">
      <div id="suggestions" class="suggestions"></div>
      <form id="chat-form">
        <input
          id="chat-input"
          type="text"
          placeholder="Ask about schedule, call times, ETA…"
          autocomplete="off"
          enterkeyhint="send"
        />
        <button id="send-btn" type="submit" aria-label="Send">Send</button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
