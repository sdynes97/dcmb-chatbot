name: Deploy

on:
  push:
    branches: [main]

# Prevent concurrent deploys
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform — Provision Azure Infrastructure
    runs-on: ubuntu-latest
    environment: production
    outputs:
      function_app_name: ${{ steps.tf-outputs.outputs.function_app_name }}
      function_app_url:  ${{ steps.tf-outputs.outputs.function_app_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        working-directory: infra
        run: terraform init
        env:
          ARM_CLIENT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET:   ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Terraform Plan
        working-directory: infra
        run: terraform plan -out=tfplan
        env:
          ARM_CLIENT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET:   ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
          TF_VAR_subscription_id:       ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          TF_VAR_anthropic_api_key:     ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_telnyx_api_key:        ${{ secrets.TELNYX_API_KEY }}
          TF_VAR_telnyx_public_key:     ${{ secrets.TELNYX_PUBLIC_KEY }}
          TF_VAR_telnyx_phone_number:   ${{ secrets.TELNYX_PHONE_NUMBER }}
          TF_VAR_telnyx_display_number: ${{ secrets.TELNYX_DISPLAY_NUMBER }}
          TF_VAR_admin_api_key:         ${{ secrets.ADMIN_API_KEY }}
          TF_VAR_director_phone:        ${{ secrets.DIRECTOR_PHONE }}
          TF_VAR_frontend_origin:       ${{ secrets.FRONTEND_ORIGIN }}

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve tfplan
        env:
          ARM_CLIENT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET:   ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Capture Terraform Outputs
        id: tf-outputs
        working-directory: infra
        run: |
          echo "function_app_name=$(terraform output -raw function_app_name)" >> $GITHUB_OUTPUT
          echo "function_app_url=$(terraform output -raw function_app_url)"   >> $GITHUB_OUTPUT
        env:
          ARM_CLIENT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET:   ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

  deploy-backend:
    name: Deploy Backend to Azure Functions
    runs-on: ubuntu-latest
    needs: terraform
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions
        uses: azure/functions-action@v1
        with:
          app-name: ${{ needs.terraform.outputs.function_app_name }}
          package: backend
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

  deploy-frontend:
    name: Deploy Frontend to GitHub Pages
    runs-on: ubuntu-latest
    needs: [terraform, deploy-backend]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Inject API base URL into config.js
        run: |
          sed -i "s|http://localhost:7071/api|${{ needs.terraform.outputs.function_app_url }}/api|g" \
            frontend/js/config.js

      - name: Update SMS display number in index.html
        run: |
          sed -i "s|(563) 555-0100|${{ secrets.TELNYX_DISPLAY_NUMBER }}|g" \
            frontend/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend
          publish_branch: gh-pages
          commit_message: "Deploy frontend [skip ci]"
