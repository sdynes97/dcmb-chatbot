name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest tests/ --cov=. --cov-report=xml --cov-report=term-missing
        env:
          ANTHROPIC_API_KEY: test-key
          ADMIN_API_KEY: test-admin-key
          AZURE_STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true
          TABLE_STORAGE_TABLE_NAME: bandschedule
          FRONTEND_ORIGIN: https://example.github.io

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  validate-seed-data:
    name: Validate Seed Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate schedule_seed.json
        run: |
          import json, sys
          with open('data/schedule_seed.json') as f:
            events = json.load(f)
          required = ['partition_key','row_key','event_type','event_name','event_date',
                'call_time','performance_time','estimated_return',
                'location_name','location_address','drop_off_location']
          errors = []
          for i, ev in enumerate(events):
            for field in required:
              if field not in ev or not str(ev[field]).strip():
                errors.append(f'Event {i}: missing {field}')
          if errors:
            for e in errors: print(e, file=sys.stderr)
            sys.exit(1)
          print(f'Validated {len(events)} events OK')

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run
