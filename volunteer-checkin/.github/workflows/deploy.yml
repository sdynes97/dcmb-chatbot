name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  ARM_CLIENT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
  ARM_CLIENT_SECRET:   ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
  ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
  ARM_TENANT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

jobs:
  deploy:
    name: Provision and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=volunteer-checkin.tfstate"
          terraform apply -input=false -auto-approve
          echo "RG=$(terraform output -raw resource_group_name)"        >> $GITHUB_ENV
          echo "FUNC=$(terraform output -raw function_app_name)"        >> $GITHUB_ENV
          echo "API_BASE=$(terraform output -raw api_base_url)"         >> $GITHUB_ENV
          echo "STORAGE=$(terraform output -raw storage_account_name)"  >> $GITHUB_ENV
          echo "KIOSK_URL=$(terraform output -raw kiosk_url)"           >> $GITHUB_ENV
        env:
          TF_VAR_subscription_id: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          TF_VAR_admin_api_key:   ${{ secrets.ADMIN_API_KEY }}
          TF_VAR_kiosk_api_key:   ${{ secrets.KIOSK_API_KEY }}

      - name: Deploy API
        run: |
          cd backend
          zip -r ../api.zip . -x "*.pyc" "__pycache__/*" "tests/*" ".pytest_cache/*" "local.settings.json"
          cd ..
          az functionapp deployment source config-zip \
            --resource-group "$RG" --name "$FUNC" --src api.zip --build-remote true

      - name: Deploy web pages
        run: |
          sed -i "s|http://localhost:7071/api|$API_BASE|g" frontend/js/config.js
          az storage blob upload-batch --account-name "$STORAGE" --auth-mode key \
            --destination '$web' --source frontend --overwrite
          echo "Kiosk: $KIOSK_URL" >> $GITHUB_STEP_SUMMARY
          echo "Admin: ${KIOSK_URL}admin.html" >> $GITHUB_STEP_SUMMARY
